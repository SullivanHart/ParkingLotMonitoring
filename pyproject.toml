[project]
name = "ParkingLotMonitoring"
version = "0.1.0"
description = "ParkingLotMonitoring"
requires-python = ">=3.11"

dependencies = [
    "setuptools==80.9.0",
    "paddlepaddle==2.6.1",
    "paddleocr==2.7.0.3",
    "shapely",
    "pyclipper",
    "scikit-image",
    "lmdb",
    "numpy==1.26.4",
    "opencv-python==4.6.0.66",
    "ultralytics==8.3.221",
    "ultralytics-thop==2.0.17",
    "pillow==12.0.0",
    "matplotlib==3.10.7",
    "requests==2.32.5",
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
    "psutil==7.1.2",
    "jinja2==3.1.6",
    "scipy==1.16.2",
    "polars==1.34.0",
    "packaging==25.0",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "threadpoolctl==3.6.0",
    "webcolors==24.11.1"
]

[tool.uv]
managed = true
exclude-dependencies = ["pymupdf"] # Block pymupdf to avoid hanging

[dependency-groups]
dev = [
    # optional dev tools
]
